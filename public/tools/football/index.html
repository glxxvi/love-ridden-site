<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SA Wolves — Game Scorer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3d2e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0b1220;
    --bg-2: #131c2e;
    --fg: #e8edf5;
    --muted: #8a96a8;
    --accent: #3ddc97;
    --border: #24304a;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }
  #app { padding: 1rem; max-width: 640px; margin: 0 auto; }
  .screen { display: flex; flex-direction: column; gap: 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
  .muted { color: var(--muted); }
  .small { font-size: 0.875rem; }
  .field { display: flex; flex-direction: column; gap: 0.375rem; }
  .field > span { font-size: 0.875rem; color: var(--muted); }
  .field > input, .field > select {
    font-size: 1rem;
    padding: 0.75rem;
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 100%;
    font-family: inherit;
  }
  .field > input:focus, .field > select:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    font-size: 1rem;
    padding: 0.875rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #052418; font-weight: 600; }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-secondary { background: var(--bg-2); color: var(--fg); border-color: var(--border); }
  .btn-link { background: none; border: none; color: var(--muted); padding: 0.25rem 0; align-self: flex-start; cursor: pointer; font-size: 0.9375rem; }
  .roster-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    gap: 1rem;
  }
  .ok { color: var(--accent); }
  .bad { color: var(--danger); }
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
