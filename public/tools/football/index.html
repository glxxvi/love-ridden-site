<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Scorer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0b">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #151516;
    --bg-3: #1f1f21;
    --border: #2a2a2d;
    --border-soft: rgba(255,255,255,0.09);
    --shadow-soft: 0 1px 2px rgba(0,0,0,0.15);

    --team-primary: #3ddc97;
    --team-primary-rgb: 61, 220, 151;
    --team-primary-fg: #052418;
    --team-secondary: #000000;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
  }

  [data-theme="dark"] {
    --fg: #e8edf5;
    --fg-muted: #8a96a8;
    --danger: #ff6b6b;
    --warn: #f0b232;
    --success: #3ddc97;
    --shadow: 0 1px 2px rgba(0,0,0,0.2);
  }

  [data-theme="light"] {
    --fg: #0f172a;
    --fg-muted: #5c6779;
    --danger: #d92638;
    --warn: #b07a00;
    --success: #0f8a52;
    --shadow: 0 1px 3px rgba(15,23,42,0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  #app { max-width: 720px; margin: 0 auto; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .app-logo {
    height: 32px;
    width: auto;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }
  .app-team {
    flex: 1;
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--team-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .theme-toggle {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--border);
    font-size: 1.125rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: border-color 0.1s;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--team-primary); }

  .app-main { padding: 1rem; }
  .screen { display: flex; flex-direction: column; gap: 1rem; }

  h1 {
    font-size: 1.375rem;
    margin: 0 0 0.25rem;
    font-weight: 600;
    text-align: center;
  }
  .muted { color: var(--fg-muted); }
  .small { font-size: 0.875rem; }

  .field { display: flex; flex-direction: column; gap: 0.375rem; }
  .field > span {
    font-size: 0.875rem;
    color: var(--fg-muted);
    text-align: center;
  }

  /* Descendant selector so inputs work inside .team-picker */
  .field input,
  .field select {
    font-size: 1rem;
    padding: 0.75rem;
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    width: 100%;
    font-family: inherit;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.45s ease, box-shadow 0.45s ease;
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: rgba(var(--team-primary-rgb), 0.32);
    box-shadow: 0 0 0 1px rgba(var(--team-primary-rgb), 0.06);
  }

  button {
    font-size: 1rem;
    padding: 0.875rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
    transition: border-color 0.1s, background-color 0.1s;
  }
  .btn-primary {
    background: var(--team-primary);
    color: var(--team-primary-fg);
    font-weight: 600;
  }
  .btn-primary:disabled {
    background: var(--border);
    color: var(--fg-muted);
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--bg-2);
    color: var(--fg);
    border-color: var(--border);
  }
  .btn-secondary:hover { border-color: var(--team-primary); }
  .btn-link {
    background: none;
    border: none;
    color: var(--fg-muted);
    padding: 0.25rem 0;
    align-self: flex-start;
    cursor: pointer;
    font-size: 0.9375rem;
  }

  .roster-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    gap: 1rem;
    box-shadow: var(--shadow);
  }
  .roster-actions { display: flex; gap: 0.5rem; }
  .roster-actions button { padding: 0.5rem 0.875rem; font-size: 0.9375rem; }

  .ok { color: var(--success); }
  .bad { color: var(--danger); }

  .textarea {
    width: 100%;
    min-height: 180px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.875rem;
    padding: 0.75rem;
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    resize: vertical;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.45s ease, box-shadow 0.45s ease;
  }
  .textarea:focus {
    outline: none;
    border-color: rgba(var(--team-primary-rgb), 0.32);
    box-shadow: 0 0 0 1px rgba(var(--team-primary-rgb), 0.06);
  }

  .file-input { font-size: 0.9375rem; color: var(--fg-muted); }
  .row-buttons { display: flex; gap: 0.5rem; }
  .row-buttons > button { flex: 1; }

  .player-list {
    max-height: 60vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-2);
    box-shadow: var(--shadow);
  }
  .player-row {
    display: grid;
    grid-template-columns: 4.5rem 1fr;
    gap: 0.25rem 0.75rem;
    padding: 0.625rem 0.75rem;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .player-row:last-child { border-bottom: none; }
  .player-row.inactive-player { opacity: 0.45; }
  .player-row .num {
    font-size: 0.875rem;
    color: var(--team-primary);
    font-weight: 600;
    white-space: nowrap;
  }
  .player-row .pname { font-weight: 500; }
  .player-row .meta { grid-column: 2; font-size: 0.8125rem; color: var(--fg-muted); }

  .badge {
    display: inline-block;
    font-size: 0.6875rem;
    font-weight: 700;
    padding: 0.125rem 0.375rem;
    background: var(--team-primary);
    color: var(--team-primary-fg);
    border-radius: 4px;
    margin-left: 0.375rem;
    vertical-align: middle;
  }
  .muted-badge { background: var(--fg-muted); color: var(--bg); }
  .warn-badge { background: var(--warn); color: #2a1a00; }

  .warn-box {
    background: var(--bg-2);
    border: 1px solid var(--warn);
    border-radius: var(--radius);
    padding: 0.5rem 0.75rem;
    box-shadow: var(--shadow);
  }
  .warn-box summary { cursor: pointer; color: var(--warn); }
  .warn-box ul { margin: 0.5rem 0 0; padding-left: 1.25rem; font-size: 0.875rem; color: var(--fg-muted); }

  .lineup-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.75rem;
    padding: 0.75rem;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .lineup-row:last-child { border-bottom: none; }
  .lineup-row.inactive { opacity: 0.5; }
  .lineup-check { width: 1.25rem; height: 1.25rem; accent-color: var(--team-primary); cursor: pointer; }
  .lineup-details { display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
  .lineup-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lineup-meta { font-size: 0.8125rem; color: var(--fg-muted); }
  .lineup-number { justify-self: end; }
  .worn-select {
    background: var(--bg-2);
    color: var(--fg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 0.375rem 0.5rem;
    font-family: inherit;
    font-size: 0.9375rem;
    min-width: 3.5rem;
    box-shadow: var(--shadow-soft);
    transition: border-color 0.45s ease, box-shadow 0.45s ease;
  }
  .worn-select:focus {
    outline: none;
    border-color: rgba(var(--team-primary-rgb), 0.32);
    box-shadow: 0 0 0 1px rgba(var(--team-primary-rgb), 0.06);
  }
  .num-fixed {
    display: inline-block;
    padding: 0.375rem 0.5rem;
    color: var(--team-primary);
    font-weight: 600;
    font-size: 0.9375rem;
  }

  .kickoff-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .kickoff-buttons button {
    padding: 1.5rem 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
  }
  .kickoff-buttons button.selected {
    background: var(--team-primary);
    color: var(--team-primary-fg);
    border-color: var(--team-primary);
  }

  /* Faceoff */
  .faceoff {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0.75rem;
    align-items: start;
    padding: 0.5rem 0 1rem;
  }
  .faceoff-team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    text-align: center;
  }
  .faceoff-logo {
    width: 84px;
    height: 84px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .faceoff-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .faceoff-initials {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    font-weight: 700;
    font-size: 1.125rem;
    letter-spacing: 0.02em;
  }
  .faceoff-name {
    font-size: 0.875rem;
    font-weight: 600;
    line-height: 1.3;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .faceoff-name.muted-name { color: var(--fg-muted); font-weight: 500; }
  .faceoff-vs {
    align-self: center;
    padding-top: 1rem;
    color: var(--fg-muted);
    font-weight: 600;
    font-size: 0.875rem;
    letter-spacing: 0.05em;
  }

  /* Team picker */
  .team-picker { position: relative; width: 100%; }
  .team-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    overflow: hidden;
    display: none;
    max-height: 40vh;
    overflow-y: auto;
  }
  .team-dropdown.visible { display: block; }
  .team-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.625rem 0.75rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background-color 0.1s;
  }
  .team-item:last-child { border-bottom: none; }
  .team-item:hover, .team-item:active {
    background: var(--bg-3);
  }
  .team-item-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .team-item-logo-fallback {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .team-item-info { min-width: 0; flex: 1; text-align: left; }
  .team-item-name {
    font-size: 0.9375rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .team-item-alias {
    font-size: 0.75rem;
    color: var(--fg-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app"><p style="padding:1rem">Loading…</p></div>
<script type="module" src="app.js"></script>
</body>
</html>
