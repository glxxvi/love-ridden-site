<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Scorer — Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #151516;
    --bg-3: #1f1f21;
    --border: #2a2a2d;
    --border-soft: rgba(255,255,255,0.09);
    --team-primary: #3ddc97;
    --team-primary-fg: #052418;
    --text: #e8e8ea;
    --text-dim: #8a8a8e;
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: contain;
  }

  #header {
    padding: 12px 16px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 4px;
  }
  .teams { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase; }
  .scores { display: flex; justify-content: center; align-items: baseline; gap: 12px; font-size: 32px; font-weight: 600; }
  .scores .dash { color: var(--text-dim); font-size: 20px; }
  .meta { display: flex; justify-content: center; gap: 16px; font-size: 12px; color: var(--text-dim); }
  .situation { text-align: center; font-size: 16px; font-weight: 500; color: var(--team-primary); padding-top: 4px; }
  .spot { text-align: center; font-size: 12px; color: var(--text-dim); }

  #log { overflow-y: auto; padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
  .entry { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .entry-title { font-size: 11px; color: var(--team-primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .entry-text { font-size: 14px; line-height: 1.45; }

  footer { padding: 12px 16px; background: var(--bg-2); border-top: 1px solid var(--border); display: flex; gap: 12px; }
  footer button {
    flex: 1; padding: 16px; font-size: 16px; font-weight: 500; font-family: inherit;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-3); color: var(--text); cursor: pointer;
    transition: background 0.1s;
  }
  footer button:active { background: var(--border); }
  footer button:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-rush { background: var(--team-primary); color: var(--team-primary-fg); border-color: var(--team-primary); }
  #btn-rush:active { background: #35c284; }

  dialog {
    border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
    border-radius: var(--radius-lg); padding: 20px; width: min(92vw, 360px); font-family: inherit;
  }
  dialog::backdrop { background: rgba(0,0,0,0.7); }
  dialog h2 { font-size: 16px; margin-bottom: 16px; color: var(--team-primary); text-transform: uppercase; letter-spacing: 1px; }
  dialog label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  dialog input[type="text"] {
    display: block; width: 100%; margin-top: 4px; padding: 12px; font-size: 20px; font-family: inherit;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  dialog input[type="text"]:focus { outline: none; border-color: var(--team-primary); }
  fieldset { border: none; padding: 0; margin: 0 0 12px; }
  fieldset legend { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  fieldset .radios { display: flex; gap: 16px; margin-bottom: 8px; }
  fieldset .radios label { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--text); margin: 0; }
  #rush-error { color: #ff7a7a; font-size: 12px; min-height: 16px; margin: 8px 0; }
  dialog menu { display: flex; gap: 12px; padding: 0; margin: 0; list-style: none; }
  dialog menu button {
    flex: 1; padding: 14px; font-size: 15px; font-family: inherit; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--bg-3); color: var(--text); cursor: pointer;
  }
  dialog menu button[type="submit"] { background: var(--team-primary); color: var(--team-primary-fg); border-color: var(--team-primary); }
</style>
</head>
<body>
  <header id="header"></header>
  <main id="log"></main>
  <footer>
    <button id="btn-rush">Rush</button>
    <button id="btn-undo" disabled>Undo</button>
  </footer>

  <dialog id="rush-dialog">
    <form id="rush-form">
      <h2>Rush</h2>
      <label>Rusher #
        <input id="rush-num" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
      </label>
      <fieldset>
        <legend>Ball ended on</legend>
        <div class="radios">
          <label><input type="radio" name="side" value="US" checked> Own</label>
          <label><input type="radio" name="side" value="OPP"> Opponent's</label>
        </div>
        <input id="rush-yard" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0–50 (50 = midfield)" required>
      </fieldset>
      <p id="rush-error" role="alert"></p>
      <menu>
        <button type="button" id="rush-cancel">Cancel</button>
        <button type="submit">Confirm</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="drive.js"></script>
</body>
</html>
